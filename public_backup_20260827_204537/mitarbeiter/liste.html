<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitarbeiterliste</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>

<style>
body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 10px; }
a.back { display:inline-block; margin-bottom:10px; text-decoration:none; color:#2563eb; }
.card { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 8px 0; display:block; text-decoration:none; color:inherit; }
.card:active { background:#eee; }
#status { font-weight:bold; margin:10px 0; }
</style>

</head>

<body>

<a class="back" href="index.html">← Zurück</a>

<h2>👷 Mitarbeiterliste</h2>

<div id="status">Lade...</div>
<div id="liste"></div>


<script>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function lade() {

  const snap = await db.collection('mitarbeiter')
    .orderBy('mitarbeiterId')
    .get();

  const statusEl = document.getElementById('status');
  const listeEl = document.getElementById('liste');

  if (snap.empty) {
    statusEl.textContent = 'Keine Mitarbeiter in der Datenbank.';
    return;
  }

  statusEl.textContent = `${snap.size} Mitarbeiter`;

  snap.forEach(doc => {

    const m = doc.data();

    const a = document.createElement('a');
    a.className = 'card';

    a.href = `detail.html?id=${encodeURIComponent(m.mitarbeiterId)}`;

    a.textContent = `${m.name} (${m.mitarbeiterId})`;

    listeEl.appendChild(a);

  });

}

lade();

</script>

</body>
</html>
