<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventar ansehen</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 10px; }
  a.back { display:inline-block; margin-bottom:10px; text-decoration:none; color:#2563eb; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 8px 0; display:block; text-decoration:none; color:inherit; }
  .card:active { background: #eee; }
  #status { font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>
<a class="back" href="index.html">← Zurück</a>
<h2>Inventar</h2>
<div id="status">Lade...</div>
<div id="liste"></div>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function lade() {
  const snap = await db.collection('werkzeuge').orderBy('werkzeugId').get();
  const statusEl = document.getElementById('status');
  const listeEl = document.getElementById('liste');
  if (snap.empty) { statusEl.textContent = 'Keine Werkzeuge in der Datenbank.'; return; }
  statusEl.textContent = `${snap.size} Objekte`;
  snap.forEach(doc => {
  const w = doc.data();

  const div = document.createElement('div');
  div.className = 'card';

  const a = document.createElement('a');
  a.href = `detail.html?id=${encodeURIComponent(w.werkzeugId)}`;
  a.textContent = `${w.name}  (${w.werkzeugId})`;
  a.style.textDecoration = 'none';
  a.style.color = 'inherit';
  a.style.display = 'block';

  const btn = document.createElement('button');
  btn.textContent = '🗑 Löschen';
  btn.style.marginTop = '10px';
  btn.style.padding = '8px';
  btn.onclick = async (e) => {
    e.preventDefault();

    if (!confirm(`"${w.name}" wirklich löschen?`)) return;

    await fetch('/api/delete-qr', {
  method:'POST',
  headers:{
    'Content-Type':'application/json'
  },
  body:JSON.stringify({
    file:w.qrFile
  })
});

await db.collection('werkzeuge').doc(w.werkzeugId).delete();

    div.remove();

    statusEl.textContent = 'Objekt gelöscht';
  };

  div.appendChild(a);
  div.appendChild(btn);
  listeEl.appendChild(div);
});
}
lade();
</script>
</body>
</html>
